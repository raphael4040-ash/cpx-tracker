<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CPX 기록판 — 주소가 바뀌었습니다</title>
<!-- 옛 주소로 들어온 사람을 새 주소로 넘긴다. 이미 공유된 링크가 죽지 않게 하려는 것이다.
     canonical 은 검색엔진에도 새 주소를 알려준다. -->
<link rel="canonical" href="https://cpx-practice.github.io/" />
<meta http-equiv="refresh" content="3; url=https://cpx-practice.github.io/" />
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2;
    --panel: #ffffff;
    --border: #e2ddd3;
    --text: #2b2621;
    --muted: #8a8175;
    --accent: #b5563b;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1a1815;
      --panel: #23201c;
      --border: #3a352d;
      --text: #ece6dc;
      --muted: #9b9285;
      --accent: #d4785f;
      --on-accent: #1a1815;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    word-break: keep-all;
  }
  .card {
    max-width: 26rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 30px 30px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 10px; }
  p { margin: 0 0 14px; font-size: 0.92rem; color: var(--muted); }
  .go {
    display: inline-block;
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .addr {
    display: block;
    margin-top: 14px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.82rem;
    color: var(--muted);
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>주소가 바뀌었습니다</h1>
    <p>CPX 기록판은 아래 주소로 옮겼습니다. 잠시 뒤 자동으로 이동합니다.</p>
    <a class="go" href="https://cpx-practice.github.io/">새 주소로 가기</a>
    <span class="addr">https://cpx-practice.github.io</span>
    <p style="margin:16px 0 0">즐겨찾기를 해두셨다면 새 주소로 바꿔주세요.</p>
  </div>
  <script>
    // meta refresh 보다 먼저, 그리고 뒤로가기 기록을 남기지 않고 넘긴다.
    location.replace("https://cpx-practice.github.io/");
  </script>
</body>
</html>
